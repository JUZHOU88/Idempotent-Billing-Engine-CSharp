name: .NET build and test
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build library
        run: dotnet build src/BillingEngine/BillingEngine.csproj --configuration Release
      - name: Build demo
        run: dotnet build src/BillingDemo/BillingDemo.csproj --configuration Release
      - name: Run test harness
        run: dotnet run --project tests/BillingTests/BillingTests.csproj --configuration Release
